name: Training checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  training:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-training.txt
      - name: Python, native, checkpoint, and shared-memory checks
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Windows checks with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set CXX=cl
          python -m unittest discover -s tests -v
      - run: node tools/test-model-policy.mjs
